name: PR805 dispatch submechanism isolation
on:
  push:
    branches: [research/pr805-mechanism-isolation-20261009]
jobs:
  isolate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build baseline capped-only and capped-plus-signal
        run: |
          set -euo pipefail
          git fetch origin 6b06dd65dbf7927a9339e4f687637f97668a181a
          git worktree add --detach /tmp/base 6b06dd65dbf7927a9339e4f687637f97668a181a
          cp -a /tmp/base /tmp/cap_only
          cp -a /tmp/base /tmp/cap_signal
          python3 - <<'PY'
          from pathlib import Path
          for variant in ('cap_only','cap_signal'):
              f=Path('/tmp')/variant/'blosc/blosc2.c'
              s=f.read_text()
              before='for (int32_t tid = 0; tid < context->nthreads; ++tid) {'
              after='int32_t workers = context->nthreads < context->nblocks ? context->nthreads : context->nblocks;\n    for (int32_t tid = 0; tid < workers; ++tid) {'
              assert s.count(before)==1, ('worker-loop',variant)
              s=s.replace(before,after)
              if variant=='cap_signal':
                  before='job.pending_workers = enqueued;\n    blosc2_pthread_mutex_unlock(&job.mutex);\n    blosc2_pthread_cond_broadcast(&pool->work_cv);'
                  after='''job.pending_workers = enqueued;
    blosc2_pthread_mutex_unlock(&job.mutex);
    if (enqueued < pool->nthreads) {
      for (int32_t i = 0; i < enqueued; ++i) {
        blosc2_pthread_cond_signal(&pool->work_cv);
      }
    } else {
      blosc2_pthread_cond_broadcast(&pool->work_cv);
    }'''
                  assert s.count(before)==1, ('wake-site',variant)
                  s=s.replace(before,after)
              f.write_text(s)
          print('Source isolation assertions passed.')
          PY
          for variant in base cap_only cap_signal; do
            cmake -S /tmp/$variant -B /tmp/build-$variant -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF
            cmake --build /tmp/build-$variant --parallel 2
            LIB=$(find /tmp/build-$variant -name 'libblosc2.so*' -type f | head -n 1)
            test -n "$LIB"
            cc -O2 -std=c11 -I /tmp/$variant/include tests/pr805_realdata_bench.c "$LIB" -Wl,-rpath,"$(dirname "$LIB")" -o /tmp/bench-$variant
          done
      - name: Paired measurements
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,statistics,json
          variants=('base','cap_only','cap_signal')
          for reuse,size,nt in ((1,49152,4),(1,49152,16),(1,65536,16),(1,131072,16),(0,131072,16),(0,49152,4),(0,16384,16)):
              samples={v:[] for v in variants}
              for round_ in range(9):
                  order=variants if round_%2==0 else tuple(reversed(variants))
                  for v in order:
                      args=[f'/tmp/bench-{v}','bench/rainfall-grid-150x150.bin',str(size),str(nt),'250',str(reuse)]
                      output=subprocess.check_output(args,text=True)
                      value=float(output.split('mean_us=')[1].split(',')[0])
                      samples[v].append(value)
              med={v:statistics.median(samples[v]) for v in variants}
              print('SUBMECHANISM '+json.dumps({'reusable':reuse,'bytes':size,'threads':nt,'median_us':med,'speedups_vs_baseline':{v:med['base']/med[v] for v in variants},'samples':samples},sort_keys=True),flush=True)
          PY
